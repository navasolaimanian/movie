  <div class="login-form">
    <div class="login-form__sign-up">
      <div class="login-form__sign-up--header">
        <h3>Create Account now!</h3>
        <button class="login">Log in <ion-icon name="log-out-outline"></ion-icon></button>
      </div>
      <p>Healthy, tasty and hassle-free meals are waiting for you. Start eating well today. You can cancel or pause
        anytime. And the first meal is on us</p>
      <form name="login-form__sign-up--form">
        <div class="login-form__sign-up--input-box">
          <label for="fullName">Full Name</label>
          <input type="text" name="fullName" placeholder="Your name" required>
        </div>

        <div class="login-form__sign-up--input-box">
          <label for="email-address">Email Address</label>
          <input type="email" name="email-address" placeholder="me@example.com" required>
        </div>

        <div class="login-form__sign-up--input-box">
          <label for="select-where">Where did you familiar with us</label>
          <select name="select-where" id="select-where" required>
            <option>Please choose one option</option>
            <option value="friends">Friends and family</option>
            <option value="youtube">YouTube video</option>
            <option value="podcast">Podcast</option>
            <option value="ad">Facebook ad</option>
            <option value="others">Others</option>
          </select>
        </div>

        <div class="login-form__sign-up--submit">
          <button class="btn btn-red">Sign Up now</button>
        </div>
      </form>
    </div>

    <div class="login-form__photo">
      <!-- <img src="img/form-cover.jpg" alt=""> -->
    </div>
    <!-- <div class="login-form__sign-in"></div> -->
  </div>
